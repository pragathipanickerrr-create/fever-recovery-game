<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f7">
  <title>Boyfriend Fever Recovery 💗</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #ef6f91;
      --deep-pink: #c94770;
      --ink: #49333d;
      --muted: #806b75;
      --paper: #fffdfd;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 14px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 10% 15%, #ffe3ec 0, transparent 32%),
                  radial-gradient(circle at 90% 85%, #ffe9d9 0, transparent 30%), #fff5f7;
      color: var(--ink);
      font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .card {
      width: min(100%, 510px);
      padding: clamp(22px, 6vw, 38px);
      border: 1px solid #f8d8e1;
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 18px 55px #bd65721c;
      text-align: center;
    }
    .badge { font-size: 2.5rem; line-height: 1; }
    h1 { margin: 13px 0 8px; font-size: clamp(1.7rem, 7vw, 2.25rem); line-height: 1.12; }
    .intro { margin: 0 auto 22px; max-width: 36ch; color: var(--muted); line-height: 1.55; }
    .progress-wrap { margin: 20px 0 22px; text-align: left; }
    .progress-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: .9rem; font-weight: 700; }
    .track { height: 12px; overflow: hidden; border-radius: 99px; background: #f8e6eb; }
    .bar { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f6a4b8, var(--pink)); transition: width .4s ease; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    button {
      min-height: 58px;
      padding: 12px 10px;
      border: 1px solid #f3d6df;
      border-radius: 16px;
      background: #fff8fa;
      color: var(--ink);
      font: inherit;
      font-size: .98rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      touch-action: manipulation;
    }
    button:hover { transform: translateY(-2px); border-color: #efa0b3; background: #fff0f4; }
    button:focus-visible { outline: 3px solid #d9567b; outline-offset: 3px; }
    button[aria-pressed="true"] { border-color: #e58ba3; background: #ffe8ee; }
    button[aria-pressed="true"]::after { content: " ✓"; color: var(--deep-pink); }
    .message {
      min-height: 84px;
      margin-top: 17px;
      padding: 17px 15px;
      border-radius: 18px;
      background: #fff3f6;
      color: #654653;
      line-height: 1.55;
      display: grid;
      place-items: center;
    }
    .message[hidden] { display: none; }
    .surprise { margin-top: 14px; padding: 18px; border-radius: 18px; background: linear-gradient(135deg, #ffe7ee, #fff1dc); animation: pop .45s ease both; }
    .surprise h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .surprise p { margin: 0; line-height: 1.55; }
    .footnote { margin: 18px 0 0; color: #927d86; font-size: .78rem; line-height: 1.5; }
    @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 360px) { .buttons { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">🩺💗</div>
    <h1 id="heading">Govu’s Fever Recovery Plan</h1>
    <p class="intro">Your very serious girlfriend-doctor has prescribed four tiny acts of self-care. Tap each one for your dose of love. 🥺</p>

    <section class="progress-wrap" aria-label="Game progress">
      <div class="progress-label"><span>Recovery mission</span><span id="count">0 / 4</span></div>
      <div class="track" id="progress-track" role="progressbar" aria-label="Recovery mission progress" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
        <div class="bar" id="progress-bar"></div>
      </div>
    </section>

    <div class="buttons" aria-label="Recovery missions">
      <button type="button" data-task="medicine" aria-pressed="false">💊 Take Medicine</button>
      <button type="button" data-task="water" aria-pressed="false">🥤 Drink Water</button>
      <button type="button" data-task="sleep" aria-pressed="false">😴 Sleep Properly</button>
      <button type="button" data-task="food" aria-pressed="false">🍲 Eat Something</button>
    </div>

    <div class="message" id="message" role="status" aria-live="polite" hidden></div>
    <section class="surprise" id="surprise" aria-live="polite" hidden>
      <h2>🎉 Prescription complete!</h2>
      <p id="surprise-text"></p>
    </section>
    <p class="footnote">A little love note, not medical advice. Follow your doctor’s instructions and rest up, okay? 💗</p>
  </main>

  <script>
    // PERSONALIZE HERE: change the name and the messages to make this yours.
    const boyfriendName = "Govu";
    const messages = {
      medicine: "Good job, handsome! Take it exactly as your doctor told you—then accept one imaginary kiss from your nurse. 😘",
      water: "Hydration mission complete! Every sip gets you one step closer to feeling better… and one step closer to me fussing over you. 🥤💗",
      sleep: "Go get some proper rest, sleepyhead. I’m officially ordering you to dream about me (doctor’s orders… sort of). 😴💕",
      food: "A few bites for my favourite patient, please! You need your strength for all the cuddles I’m saving up. 🍲🥰",
      surprise: "You did all four things! I’m so proud of you, my love. Now rest, get better soon, and remember: your girlfriend is sending the biggest hug and a million kisses. 💗🤗😘"
    };

    document.getElementById("heading").textContent = `${boyfriendName}’s Fever Recovery Plan`;
    document.getElementById("surprise-text").textContent = messages.surprise;

    const completed = new Set();
    const messageBox = document.getElementById("message");
    const surpriseBox = document.getElementById("surprise");
    const count = document.getElementById("count");
    const bar = document.getElementById("progress-bar");
    const track = document.getElementById("progress-track");

    document.querySelectorAll("button[data-task]").forEach((button) => {
      button.addEventListener("click", () => {
        const task = button.dataset.task;
        const firstTime = !completed.has(task);
        completed.add(task);
        button.setAttribute("aria-pressed", "true");
        messageBox.textContent = messages[task];
        messageBox.hidden = false;

        const total = completed.size;
        count.textContent = `${total} / 4`;
        bar.style.width = `${(total / 4) * 100}%`;
        track.setAttribute("aria-valuenow", String(total));

        if (total === 4) surpriseBox.hidden = false;
        // Clicking an already-completed button shows its message again without extra progress.
      });
    });
  </script>
</body>
</html>
